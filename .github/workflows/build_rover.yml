name: Build CubeOrangePlus Rover

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'Vetri2425/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PX4 v1.16.2
        uses: actions/checkout@v4
        with:
          repository: PX4/PX4-Autopilot
          ref: v1.16.2
          submodules: recursive

      - name: Fetch NuttX submodule tags
        run: |
          cd platforms/nuttx/NuttX/nuttx
          git fetch --tags --depth=1

      - name: Checkout rover patches from fork
        uses: actions/checkout@v4
        with:
          repository: Vetri2425/PX4-Autopilot
          ref: main
          path: fork_patches

      - name: Apply rover patches
        run: |
          cp fork_patches/boards/cubepilot/cubeorangeplus/rover.px4board \
             boards/cubepilot/cubeorangeplus/rover.px4board
          cp fork_patches/src/modules/rover_differential/RoverDifferential.cpp \
             src/modules/rover_differential/RoverDifferential.cpp
          cp fork_patches/src/modules/rover_differential/RoverDifferential.hpp \
             src/modules/rover_differential/RoverDifferential.hpp
          cp fork_patches/src/modules/rover_differential/module.yaml \
             src/modules/rover_differential/module.yaml
          cp fork_patches/src/modules/rover_differential/DifferentialVelControl/DifferentialVelControl.cpp \
             src/modules/rover_differential/DifferentialVelControl/DifferentialVelControl.cpp
          cp fork_patches/src/modules/rover_differential/DifferentialVelControl/DifferentialVelControl.hpp \
             src/modules/rover_differential/DifferentialVelControl/DifferentialVelControl.hpp
          cp fork_patches/src/modules/rover_differential/DifferentialVelControl/CMakeLists.txt \
             src/modules/rover_differential/DifferentialVelControl/CMakeLists.txt
          # Rover yaw-rate feedforward (2026-09-05): velocity-mode OFFBOARD discarded
          # trajectory_setpoint.yawspeed, so DifferentialAttControl's pure-P yaw loop had
          # no feedforward input at all (documented structural floor: following err
          # ~= omega/RO_YAW_P). This plumbs yawspeed through VelControl -> AttControl,
          # gated by the new RD_YAW_RATE_FF (default 0 => flashing is behaviour-neutral).
          # The gate is NOT optional caution: the Jetson companion sends a heading-error
          # feedback term (segment_yaw_rate_gain * theta_e, gain 1.5) in yawspeed on the
          # production segment profile, and RO_YAW_P is also 1.5 on the same error, so an
          # ungated sum would double the heading-loop gain. Only the smooth/arc profile
          # sends a true curvature*speed feedforward. Bearing deliberately stays
          # atan2(vy,vx): trajectory_setpoint.yaw is not honoured because the reverse
          # 180-degree flip is only valid on a direction-of-travel heading.
          # DifferentialAttControl.{cpp,hpp} here are v1.16.2-stock RE-ANCHORED per
          # base-discipline rule: fork-main's copy is a post-v1.16.2 mode-dispatch
          # refactor (DifferentialDriveModes/DifferentialOffboardMode) that has never
          # been on this overlay list and is not what's built. Same for
          # DifferentialVelocitySetpoint.msg, which that refactor deleted outright but
          # which the actual v1.16.2 base still uses.
          cp fork_patches/msg/RoverAttitudeSetpoint.msg \
             msg/RoverAttitudeSetpoint.msg
          cp fork_patches/msg/DifferentialVelocitySetpoint.msg \
             msg/DifferentialVelocitySetpoint.msg
          cp fork_patches/src/modules/rover_differential/DifferentialAttControl/DifferentialAttControl.cpp \
             src/modules/rover_differential/DifferentialAttControl/DifferentialAttControl.cpp
          cp fork_patches/src/modules/rover_differential/DifferentialAttControl/DifferentialAttControl.hpp \
             src/modules/rover_differential/DifferentialAttControl/DifferentialAttControl.hpp
          # NOTE: DifferentialPosControl is intentionally NOT overlaid.
          # The fork's PosControl is from a post-v1.16.2 refactor that requires
          # RoverSpeedSetpoint.msg / RoverSpeedStatus.msg, which do not exist in
          # v1.16.2 -> compile failure. Stock v1.16.2 PosControl is used instead:
          # it publishes differential_velocity_setpoint (consumed by VelControl)
          # and gates all output behind flag_armed (covers P1's disarm guard).
          cp fork_patches/src/modules/land_detector/RoverLandDetector.cpp \
             src/modules/land_detector/RoverLandDetector.cpp
          cp fork_patches/src/modules/navigator/mission_block.cpp \
             src/modules/navigator/mission_block.cpp
          # RoboClaw "Option A" velocity (QPPS) overlay - closed-loop on encoders.
          cp fork_patches/src/drivers/roboclaw/Roboclaw.cpp \
             src/drivers/roboclaw/Roboclaw.cpp
          cp fork_patches/src/drivers/roboclaw/Roboclaw.hpp \
             src/drivers/roboclaw/Roboclaw.hpp
          cp fork_patches/src/drivers/roboclaw/module.yaml \
             src/drivers/roboclaw/module.yaml
          # EKF2 wheel-encoder body-frame velocity fusion (ground rover).
          # All EKF2 files below are v1.16.2-stock + additive wheel-encoder changes
          # (re-anchored onto v1.16.2 per base-discipline rule). New dir must be created.
          mkdir -p src/modules/ekf2/EKF/aid_sources/wheel_encoder
          cp fork_patches/msg/EstimatorAidSource3d.msg \
             msg/EstimatorAidSource3d.msg
          cp fork_patches/src/modules/ekf2/Kconfig \
             src/modules/ekf2/Kconfig
          cp fork_patches/src/modules/ekf2/CMakeLists.txt \
             src/modules/ekf2/CMakeLists.txt
          cp fork_patches/src/modules/ekf2/params_wheel_encoder.yaml \
             src/modules/ekf2/params_wheel_encoder.yaml
          cp fork_patches/src/modules/ekf2/params_gnss_yaw.yaml \
             src/modules/ekf2/params_gnss_yaw.yaml
          cp fork_patches/src/modules/ekf2/EKF2.cpp \
             src/modules/ekf2/EKF2.cpp
          cp fork_patches/src/modules/ekf2/EKF2.hpp \
             src/modules/ekf2/EKF2.hpp
          cp fork_patches/src/modules/ekf2/EKF/CMakeLists.txt \
             src/modules/ekf2/EKF/CMakeLists.txt
          cp fork_patches/src/modules/ekf2/EKF/common.h \
             src/modules/ekf2/EKF/common.h
          cp fork_patches/src/modules/ekf2/EKF/control.cpp \
             src/modules/ekf2/EKF/control.cpp
          cp fork_patches/src/modules/ekf2/EKF/ekf.h \
             src/modules/ekf2/EKF/ekf.h
          cp fork_patches/src/modules/ekf2/EKF/estimator_interface.h \
             src/modules/ekf2/EKF/estimator_interface.h
          cp fork_patches/src/modules/ekf2/EKF/estimator_interface.cpp \
             src/modules/ekf2/EKF/estimator_interface.cpp
          cp fork_patches/src/modules/ekf2/EKF/aid_sources/wheel_encoder/wheel_encoder_fusion.cpp \
             src/modules/ekf2/EKF/aid_sources/wheel_encoder/wheel_encoder_fusion.cpp
          # EKF2 GNSS heading fusion: v1.16.2-stock gnss_yaw_control.cpp + an
          # additive innovation-floor override (re-anchored onto v1.16.2 per
          # base-discipline rule - fork-main's copy is post-v1.18-alpha and
          # references renamed fields: ekf2_gps_ctrl, ekf2_hdg_gate,
          # _gnss_checks.passed(), none of which exist in the v1.16.2-based
          # common.h/ekf.h this overlay keeps).
          cp fork_patches/src/modules/ekf2/EKF/aid_sources/gnss/gnss_yaw_control.cpp \
             src/modules/ekf2/EKF/aid_sources/gnss/gnss_yaw_control.cpp
          # Logger overlay: v1.16.2-stock logged_topics.cpp + wheel-encoder debug
          # topics (raw wheel_encoders + estimator_aid_src_wheel_encoder). Base is
          # v1.16.2 stock (NOT the fork's post-v1.18 tree) per base-discipline rule.
          cp fork_patches/src/modules/logger/logged_topics.cpp \
             src/modules/logger/logged_topics.cpp

      - name: Install dependencies
        run: |
          bash ./Tools/setup/ubuntu.sh --no-sim-tools
          pip3 install packaging

      - name: Build rover firmware
        run: make cubepilot_cubeorangeplus_rover

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: cubeorangeplus_rover_firmware
          path: build/cubepilot_cubeorangeplus_rover/cubepilot_cubeorangeplus_rover.px4
